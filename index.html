<style>
  :root{
    --navy:#4a1a24;--ink:#2c1b1f;--muted:#8a6e73;--line:#efdee1;--bg:#fbf4f5;--card:#ffffff;
    --blue:#8c2c38;--indigo:#a84f5a;--violet:#c47982;--teal:#b05260;--amber:#b97135;
    --g1:linear-gradient(135deg,#4a1220 0%,#8c2c38 55%,#a84f5a 100%);
    --shadow:0 1px 2px rgba(74,18,32,.05),0 8px 24px rgba(74,18,32,.07);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1480px;margin:0 auto;padding:22px 26px 40px}

  /* ===== Hero ===== */
  .hero{position:relative;overflow:hidden;background:var(--g1);border-radius:18px;padding:26px 30px;color:#fff;box-shadow:0 14px 34px rgba(31,58,138,.22);margin-bottom:18px}
  .hero:before{content:"";position:absolute;right:-40px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 68%)}
  .hero:after{content:"";position:absolute;right:120px;bottom:-140px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,218,.26),rgba(255,214,218,0) 70%)}
  .hero-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
  .brand-tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:2px;font-weight:600;color:rgba(255,255,255,.85);background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);padding:5px 12px;border-radius:999px}
  .brand-tag svg{width:14px;height:14px;fill:#fff}
  h1{font-size:27px;margin:14px 0 6px;font-weight:700;letter-spacing:.5px}
  .hero .sub{margin:0;font-size:12.5px;color:rgba(255,255,255,.78);line-height:1.65;max-width:860px}
  .hero-side{display:flex;flex-direction:column;align-items:flex-end;gap:12px;flex:none}
  .live{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:7px 13px;border-radius:999px}
  .live .dot{width:7px;height:7px;border-radius:50%;background:#ffd7dc;box-shadow:0 0 0 4px rgba(255,215,220,.24)}
  .hero-range{font-size:12px;color:rgba(255,255,255,.82);text-align:right}

  /* ===== Panels ===== */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
  .panel-title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;color:var(--navy)}
  .panel-title .bar{width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--blue),var(--violet))}
  .panel-title small{font-size:11px;color:var(--muted);font-weight:400;margin-left:2px}

  /* ===== Filters ===== */
  .filters{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr)) auto;gap:12px;align-items:end}
  .f label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.3px}
  select,input[type=date],button{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s}
  select:focus,input:focus,.ms-btn:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(140,44,56,.14)}
  button{cursor:pointer;background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
  button:hover{filter:brightness(1.05)}
  button.ghost{background:#fff;color:var(--blue)}
  .hint{margin-top:11px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .hint svg{width:14px;height:14px;fill:var(--blue);flex:none}

  /* ===== KPIs ===== */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px}
  .kpi{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px 14px;box-shadow:var(--shadow);overflow:hidden;transition:transform .18s,box-shadow .18s}
  .kpi:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(18,33,63,.12)}
  .kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac)}
  .kpi-head{display:flex;align-items:center;gap:8px}
  .kpi-ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--acbg)}
  .kpi-ico svg{width:15px;height:15px;fill:var(--ac)}
  .kpi-label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .kpi .v{font-size:25px;font-weight:750;letter-spacing:-.6px;margin-top:11px;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
  .kpi .unit{font-size:11.5px;color:var(--muted);margin-top:6px}
  .kpi:nth-child(1){--ac:#8c2c38;--acbg:#f6e9ea}
  .kpi:nth-child(2){--ac:#a84f5a;--acbg:#faeef0}
  .kpi:nth-child(3){--ac:#b05260;--acbg:#f9e9ec}
  .kpi:nth-child(4){--ac:#c47982;--acbg:#fdf0f0}
  .kpi:nth-child(5){--ac:#b97135;--acbg:#fbf0e6}

  /* ===== Charts ===== */
  .grid2{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:16px}
  .chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .metric-btns{display:flex;gap:6px;flex-wrap:wrap}
  .metric-btns button{padding:5px 11px;font-size:12px;background:#f8eef0;color:#8c2c38;border-color:transparent;border-radius:7px}
  .metric-btns button.active{background:var(--blue);color:#fff;box-shadow:0 4px 10px rgba(140,44,56,.26)}
  svg{width:100%;height:auto;display:block}
  .axis{stroke:#e3ced2;stroke-width:1}
  .gridline{stroke:#f5e9eb;stroke-width:1;stroke-dasharray:4 4}
  .lbl{fill:var(--muted);font-size:10.5px}

  /* ===== Table ===== */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;background:#fdf7f7;white-space:nowrap}
  tbody tr:hover{background:#fdf4f5}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .rank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:#f4e7e9;color:var(--muted);font-size:11px;font-weight:700;margin-right:8px}
  .rank.top1{background:var(--blue);color:#fff}
  .rank.top2{background:#6d8fe0;color:#fff}
  .rank.top3{background:#a9bce9;color:#fff}
  .spendcell{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .minibar{width:74px;height:4px;border-radius:2px;background:#f4e7e9;overflow:hidden}
  .minibar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--violet))}

  .note{color:var(--muted);font-size:12px;line-height:1.65}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .source{padding:14px 18px}
  .source strong{color:var(--navy)}

  /* ===== Multi-select ===== */
  .ms{position:relative}
  .ms-btn{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:13px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .ms-btn:hover{border-color:var(--blue)}
  .ms-panel{position:absolute;z-index:50;top:calc(100% + 4px);left:0;right:0;max-height:280px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(74,18,32,.18);padding:7px;display:none}
  .ms-panel.open{display:block}
  .ms-search{width:100%;padding:7px 9px;margin-bottom:6px;border:1px solid var(--line);border-radius:7px;font-size:12px;outline:none}
  .ms-search:focus{border-color:var(--blue)}
  .ms-tools{display:flex;gap:6px;padding:2px 4px 7px;border-bottom:1px solid var(--line);margin-bottom:5px}
  .ms-tools button{padding:4px 9px;font-size:12px;background:#f8eef0;color:#8c2c38;border-color:transparent;border-radius:6px}
  .ms-item{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:6px;cursor:pointer;font-size:13px;line-height:1.3}
  .ms-item:hover{background:#f9f0f1}
  .ms-item input{margin:0;flex:none;accent-color:var(--blue)}

  @media(max-width:1080px){.filters{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.hero-top{flex-direction:column}.hero-side{align-items:flex-start}}
</style>
</head>

<script>
const D=JSON.parse(document.getElementById('dashboardData').textContent);
const $=id=>document.getElementById(id);
const dateIdx=D.dates, mediaArr=D.media, media2Arr=D.media2||[], matArr=D.materials, audArr=D.audiences, rows=D.data;
const metrics=[{k:'spend',n:'投资'},{k:'imp',n:'展示'},{k:'click',n:'点击'},{k:'ctr',n:'CTR'},{k:'cpm',n:'CPM'}];
let curMetric='spend';

function fmtMoney(v){return '¥'+v.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtInt(v){return Math.round(v).toLocaleString('zh-CN')}
function fmtPct(v){return v.toFixed(2)+'%'}
function metricVal(r,k){const s=r[5],i=r[6],c=r[7];if(k==='spend')return s;if(k==='imp')return i;if(k==='click')return c;if(k==='ctr')return i>0?c/i*100:0;if(k==='cpm')return i>0?s/i*1000:0;return 0}
function fmtMetric(v,k){if(k==='spend'||k==='cpm')return fmtMoney(v);if(k==='ctr')return fmtPct(v);return fmtInt(v)}

const LS_KEY='dsc_dashboard_state_v2';
function selected(id){return [...$(id).selectedOptions].map(o=>o.value)}
function setSelected(id,vals){
  const el=$(id);[...el.options].forEach(o=>o.selected=(Array.isArray(vals)&&vals.map(String).includes(String(o.value))));
  syncMulti(id);
}
const multiDefaults={media:'全部媒体',media2:'全部二级媒体',material:'全部素材',audience:'全部人群'};
function updateMultiLabel(id){
  const vals=selected(id),label=$('btn-'+id);
  if(!label)return;
  if(!vals.length||vals.includes('all'))label.textContent=multiDefaults[id]||'全部';
  else if(vals.length<=2)label.textContent=vals.map(v=>{const o=[...$(id).options].find(x=>x.value===String(v));return o?o.textContent:v}).join('、');
  else label.textContent='已选 '+vals.length+' 项';
}
function syncMulti(id){
  const panel=$('panel-'+id);if(!panel)return;
  panel.querySelectorAll('.ms-item input').forEach(cb=>{const o=[...$(id).options].find(x=>x.value===cb.value);cb.checked=!!(o&&o.selected)});
  updateMultiLabel(id);
}
function buildMulti(id){
  const panel=$('panel-'+id);if(!panel)return;
  let html='<input type="text" class="ms-search" placeholder="搜索…"><div class="ms-tools"><button type="button" data-act="all">全选</button><button type="button" data-act="none">清空</button></div>';
  [...$(id).options].forEach(o=>{html+='<label class="ms-item"><input type="checkbox" value="'+o.value+'"><span>'+o.textContent+'</span></label>'});
  panel.innerHTML=html;
  panel.addEventListener('input',e=>{
    if(!e.target.classList||!e.target.classList.contains('ms-search'))return;
    const q=e.target.value.trim().toLowerCase();
    panel.querySelectorAll('.ms-item').forEach(item=>{item.style.display=item.textContent.toLowerCase().includes(q)?'':'none'});
  });
  panel.addEventListener('click',e=>{
    e.stopPropagation();
    const tool=e.target.closest('[data-act]');
    if(tool){[...$(id).options].forEach(o=>o.selected=tool.dataset.act==='all');syncMulti(id);render();return}
  });
  panel.addEventListener('change',e=>{
    if(e.target.type!=='checkbox')return;
    const o=[...$(id).options].find(x=>x.value===e.target.value);
    if(o)o.selected=e.target.checked;
    reconcileFilters();
    updateMultiLabel(id);render();
  });
  $('btn-'+id).addEventListener('click',e=>{
    e.stopPropagation();
    const was=panel.classList.contains('open');
    document.querySelectorAll('.ms-panel').forEach(p=>p.classList.remove('open'));
    if(!was)panel.classList.add('open');
  });
  updateMultiLabel(id);
}
function saveState(){try{localStorage.setItem(LS_KEY,JSON.stringify({d1:$('d1').value,d2:$('d2').value,media:selected('media'),media2:selected('media2'),material:selected('material'),audience:selected('audience'),metric:curMetric}))}catch(e){}}
function loadState(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'null')}catch(e){return null}}
function applyState(s){
  if(!s)return;
  if(dateIdx.includes(s.d1))$('d1').value=s.d1;
  if(dateIdx.includes(s.d2))$('d2').value=s.d2;
  ['media','media2','material','audience'].forEach(id=>{if(Array.isArray(s[id]))setSelected(id,s[id])});
  if(metrics.some(m=>m.k===s.metric))curMetric=s.metric;
}
function mediaGroup(r){return media2Arr[r[2]]==='TOP'?'TOP':'抖音'}
function reconcileFilters(){
  const dyIdx=mediaArr.map((v,i)=>(v==='抖音竞价'||v==='抖音合约')?String(i):null).filter(x=>x!==null);
  const m=selected('media'),m2=selected('media2');
  const onlyTop=m.length&&!m.includes('all')&&m.includes('TOP')&&!m.includes('抖音');
  const onlyDy=m.length&&!m.includes('all')&&m.includes('抖音')&&!m.includes('TOP');
  if(onlyTop)setSelected('media2',m2.filter(x=>!dyIdx.includes(x)));
  if(onlyDy)setSelected('media2',m2.filter(x=>dyIdx.includes(x)));
  const m2b=selected('media2');
  if(m2b.length&&m2b.every(x=>dyIdx.includes(x)))setSelected('media',['抖音']);
  else if(m2b.length&&m2b.every(x=>!dyIdx.includes(x)))setSelected('media',['TOP']);
  else if(m2b.length)setSelected('media',['all']);
}

function init(){
  $('d1').min=dateIdx[0];$('d1').max=dateIdx[dateIdx.length-1];$('d1').value=dateIdx[0];
  $('d2').min=dateIdx[0];$('d2').max=dateIdx[dateIdx.length-1];$('d2').value=dateIdx[dateIdx.length-1];
  fill('media2',mediaArr);fill('material',matArr);fill('audience',audArr);
  ['media','media2','material','audience'].forEach(buildMulti);
  setSelected('media',['all']);
  applyState(loadState());
  reconcileFilters();
  metrics.forEach(m=>{const b=document.createElement('button');b.textContent=m.n;b.dataset.k=m.k;b.className=m.k===curMetric?'active':'';b.onclick=()=>{curMetric=m.k;document.querySelectorAll('#metricBtns button').forEach(x=>x.classList.toggle('active',x.dataset.k===curMetric));render()};$('metricBtns').appendChild(b)});
  ['d1','d2'].forEach(id=>$(id).addEventListener('change',render));
  document.addEventListener('click',()=>document.querySelectorAll('.ms-panel').forEach(p=>p.classList.remove('open')));
  $('reset').onclick=()=>{$('d1').value=dateIdx[0];$('d2').value=dateIdx[dateIdx.length-1];setSelected('media',['all']);setSelected('media2',[]);setSelected('material',[]);setSelected('audience',[]);curMetric='spend';document.querySelectorAll('#metricBtns button').forEach(x=>x.classList.toggle('active',x.dataset.k==='spend'));render()};
  $('subtitle').textContent='数据来源：'+D.meta.sources.join(' + ')+' ｜ 生成时间：'+D.meta.generated+' ｜ 汇总后 '+D.meta.aggRows.toLocaleString('zh-CN')+' 行';
  $('heroRange').textContent='覆盖 '+dateIdx[0]+' 至 '+dateIdx[dateIdx.length-1]+' ｜ 共 '+dateIdx.length+' 个投放日';
  $('sourceNote').innerHTML='<strong>口径说明</strong>　'+D.meta.note+'　媒体：TOP / 抖音（抖音含竞价与合约）；二级媒体为具体媒体。CTR = 点击 ÷ 展示；CPM = 投资 ÷ 展示 × 1000。金额单位：元，保留两位小数。';
  render();
}
function fill(id,arr){const s=$(id);arr.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v;s.appendChild(o)})}
function filtered(){
  const a=Math.max(0,dateIdx.indexOf($('d1').value)), b=Math.min(dateIdx.length-1,dateIdx.indexOf($('d2').value));
  const mSel=selected('media'),m2Sel=selected('media2'),tSel=selected('material'),uSel=selected('audience');
  const lo=Math.min(a,b),hi=Math.max(a,b);
  return rows.filter(r=>{
    if(r[0]<lo||r[0]>hi)return false;
    if(mSel.length&&!mSel.includes('all')&&!mSel.includes(mediaGroup(r)))return false;
    if(m2Sel.length&&!m2Sel.includes(String(r[1])))return false;
    if(tSel.length&&!tSel.includes(String(r[3])))return false;
    if(uSel.length&&!uSel.includes(String(r[4])))return false;
    return true;
  });
}
function render(){
  const f=filtered(),sum=[0,0,0];f.forEach(r=>{sum[0]+=r[5];sum[1]+=r[6];sum[2]+=r[7]});
  $('kpiSpend').textContent=fmtMoney(sum[0]);$('kpiImp').textContent=fmtInt(sum[1]);$('kpiClick').textContent=fmtInt(sum[2]);
  $('kpiCtr').textContent=fmtPct(sum[1]>0?sum[2]/sum[1]*100:0);$('kpiCpm').textContent=fmtMoney(sum[1]>0?sum[0]/sum[1]*1000:0);
  $('trendNote').textContent='当前指标：'+metrics.find(m=>m.k===curMetric).n+' ｜ 匹配 '+f.length.toLocaleString('zh-CN')+' 行';
  drawTrend(f);drawMedia(f);drawTop(f);
  saveState();
}
function drawTrend(f){
  const m=curMetric,map=new Map();f.forEach(r=>{const d=r[0],a=map.get(d)||[0,0,0];a[0]+=r[5];a[1]+=r[6];a[2]+=r[7];map.set(d,a)});
  const keys=[...map.keys()].sort((x,y)=>x-y);const el=$('trendChart');
  if(!keys.length){el.innerHTML='<div class="empty">当前筛选组合无数据：请检查「媒体」与「二级媒体」是否匹配（TOP 对应非抖音媒体，抖音对应竞价/合约），或点「重置筛选」</div>';return}
  const vals=keys.map(k=>metricVal([0,0,0,0,0,...map.get(k)],m));const max=Math.max(...vals,1);
  const W=880,H=280,P={l:64,r:20,t:22,b:40},iw=W-P.l-P.r,ih=H-P.t-P.b;
  const x=i=>P.l+(keys.length===1?iw/2:i/(keys.length-1)*iw), y=v=>P.t+ih-v/max*ih;
  let s='<svg viewBox="0 0 '+W+' '+H+'"><defs><linearGradient id="areaBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8c2c38" stop-opacity="0.24"/><stop offset="100%" stop-color="#8c2c38" stop-opacity="0.01"/></linearGradient></defs>';
  for(let g=0;g<=4;g++){const yy=P.t+ih-g/4*ih;s+='<line class="gridline" x1="'+P.l+'" y1="'+yy+'" x2="'+(W-P.r)+'" y2="'+yy+'"/><text class="lbl" x="'+(P.l-8)+'" y="'+(yy+4)+'" text-anchor="end">'+fmtMetric(max*g/4,m)+'</text>'}
  s+='<line class="axis" x1="'+P.l+'" y1="'+(P.t+ih)+'" x2="'+(W-P.r)+'" y2="'+(P.t+ih)+'"/>';
  const step=Math.max(1,Math.ceil(keys.length/8));for(let i=0;i<keys.length;i+=step){s+='<text class="lbl" x="'+x(i)+'" y="'+(H-12)+'" text-anchor="middle">'+dateIdx[keys[i]].slice(5)+'</text>'}
  if(keys.length>1){s+='<polygon points="'+x(0)+','+(P.t+ih)+' '+keys.map((k,i)=>x(i)+','+y(vals[i])).join(' ')+' '+x(keys.length-1)+','+(P.t+ih)+'" fill="url(#areaBlue)"/>'}
  if(keys.length===1){s+='<circle cx="'+x(0)+'" cy="'+y(vals[0])+'" r="5" fill="#8c2c38"/><text class="lbl" x="'+x(0)+'" y="'+(y(vals[0])-10)+'" text-anchor="middle">'+fmtMetric(vals[0],m)+'</text>'}
  else{s+='<polyline points="'+keys.map((k,i)=>x(i)+','+y(vals[i])).join(' ')+'" fill="none" stroke="#8c2c38" stroke-width="2.4" stroke-linejoin="round"/>';keys.forEach((k,i)=>{s+='<circle cx="'+x(i)+'" cy="'+y(vals[i])+'" r="2.6" fill="#fff" stroke="#8c2c38" stroke-width="1.5"><title>'+dateIdx[k]+'：'+fmtMetric(vals[i],m)+'</title></circle>'})}
  if(vals.length>=2){
    let sx=0,sy=0,sxx=0,sxy=0;
    for(let i=0;i<vals.length;i++){sx+=i;sy+=vals[i];sxx+=i*i;sxy+=i*vals[i]}
    const denom=vals.length*sxx-sx*sx||1,b=(vals.length*sxy-sx*sy)/denom,a=(sy-b*sx)/vals.length;
    const clamp=v=>Math.max(P.t,Math.min(P.t+ih,y(v)));
    s+='<polyline points="'+x(0)+','+clamp(a)+' '+x(vals.length-1)+','+clamp(a+b*(vals.length-1))+'" fill="none" stroke="#b97135" stroke-width="2" stroke-dasharray="6 4"><title>线性趋势线</title></polyline>';
    s+='<text x="'+(W-P.r)+'" y="'+(P.t+13)+'" text-anchor="end" fill="#b97135" font-size="11" font-weight="bold">趋势线 '+(b>=0?'↑':'↓')+'</text>';
  }
  s+='</svg>';el.innerHTML=s;
}
function drawMedia(f){
  const m=curMetric,map=new Map();f.forEach(r=>{const k=mediaGroup(r),a=map.get(k)||[0,0,0];a[0]+=r[5];a[1]+=r[6];a[2]+=r[7];map.set(k,a)});
  const all=[...map.entries()].map(([k,a])=>[k,metricVal([0,0,0,0,0,...a],m)]).sort((a,b)=>b[1]-a[1]);
  const arr=all.slice(0,12);const el=$('mediaChart');
  if(!arr.length){el.innerHTML='<div class="empty">当前筛选组合无数据：请检查「媒体」与「二级媒体」是否匹配（TOP 对应非抖音媒体，抖音对应竞价/合约），或点「重置筛选」</div>';return}
  const total=all.reduce((s,x)=>s+x[1],0);
  const max=Math.max(...arr.map(x=>x[1]),1),W=420,rowH=46,H=arr.length*rowH+14,L=76,R=126;
  const COLS={'TOP':'#8c2c38','抖音':'#b05260'};
  let s='<svg viewBox="0 0 '+W+' '+H+'">';
  arr.forEach((a,i)=>{
    const w=(a[1]/max)*(W-L-R),yy=i*rowH+13,pct=total>0?(a[1]/total*100):0,col=COLS[a[0]]||'#8c2c38';
    s+='<text class="lbl" x="'+(L-8)+'" y="'+(yy+5)+'" text-anchor="end" font-weight="600">'+a[0]+'</text>';
    s+='<rect x="'+L+'" y="'+yy+'" width="'+(W-L-R)+'" height="15" rx="7.5" fill="#f7ecee"/>';
    s+='<rect x="'+L+'" y="'+yy+'" width="'+Math.max(2,w)+'" height="15" rx="7.5" fill="'+col+'" opacity="0.92"/>';
    s+='<text class="lbl" x="'+(L+w+7)+'" y="'+(yy+12)+'">'+fmtMetric(a[1],m)+'</text>';
    s+='<rect x="'+(L+w+7)+'" y="'+(yy+19)+'" width="58" height="16" rx="8" fill="'+(a[0]==='TOP'?'#f6e9ea':'#faeef0')+'"/>';
    s+='<text x="'+(L+w+36)+'" y="'+(yy+30)+'" text-anchor="middle" fill="'+col+'" font-size="10.5" font-weight="bold">'+pct.toFixed(1)+'%</text>';
  });
  s+='</svg>';el.innerHTML=s;
}
function drawTop(f){
  const map=new Map();f.forEach(r=>{const k=r[3]+'||'+r[1]+'||'+r[2],a=map.get(k)||{mat:matArr[r[3]]||'未知',med:mediaGroup(r),m2:mediaArr[r[1]]||'未知',s:0,i:0,c:0};a.s+=r[5];a.i+=r[6];a.c+=r[7];map.set(k,a)});
  const arr=[...map.values()].sort((a,b)=>b.s-a.s).slice(0,10);const tb=$('topTable').querySelector('tbody');
  if(!arr.length){tb.innerHTML='<tr><td colspan="8" class="empty">当前筛选组合无数据：请检查「媒体」与「二级媒体」是否匹配（TOP 对应非抖音媒体，抖音对应竞价/合约），或点「重置筛选」</td></tr>';return}
  const topS=arr[0].s||1;
  tb.innerHTML=arr.map((a,idx)=>{
    const rk=idx+1,rc=rk===1?'top1':rk===2?'top2':rk===3?'top3':'';
    return '<tr><td title="'+a.mat.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'"><span class="rank '+rc+'">'+rk+'</span>'+a.mat.slice(0,42)+(a.mat.length>42?'…':'')+'</td><td>'+a.med+'</td><td>'+a.m2+'</td><td class="num"><div class="spendcell"><span>'+fmtMoney(a.s)+'</span><span class="minibar"><i style="width:'+Math.max(3,a.s/topS*100)+'%"></i></span></div></td><td class="num">'+fmtInt(a.i)+'</td><td class="num">'+fmtInt(a.c)+'</td><td class="num">'+fmtPct(a.i>0?a.c/a.i*100:0)+'</td><td class="num">'+fmtMoney(a.i>0?a.s/a.i*1000:0)+'</td></tr>';
  }).join('');
}
init();
</script>
